events { 
    worker_connections 1024; 
}

http {
    # Increase buffer and timeout limits for stable streaming connections
    client_max_body_size 20M;
    keepalive_timeout 65;

    # Standard HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name radio.immortalraindrops.art;
        
        # Let's Encrypt validation path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS SSL Reverse Proxy to Icecast
    server {
        listen 443 ssl;
        server_name radio.immortalraindrops.art;

        # SSL Certificates (Managed via Certbot on host or container volume)
        ssl_certificate /etc/nginx/certs/live/radio.immortalraindrops.art/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/radio.immortalraindrops.art/privkey.pem;

        # SSL Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /radio {
            proxy_pass http://icecast:8000/radio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL: Disable proxy buffering for live radio stream to prevent latencies
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Status and administration pages
        location / {
            proxy_pass http://icecast:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
