events { 
    worker_connections 1024; 
}

http {
    # Optimized settings for stable real-time audio streams
    client_max_body_size 20M;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name radio.immortalraindrops.art localhost;

        location /radio {
            proxy_pass http://127.0.0.1:8000/radio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable proxy buffering for stable audio streaming
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Liquidsoap command API (proxied to server.harbor on port 7000)
        location /api/ {
            proxy_pass http://127.0.0.1:7000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # Status & Administration pages
        location / {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
