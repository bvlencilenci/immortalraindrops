app = 'immortal-radio'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  UNIFIED_DIR = '/music/unified'
  ICECAST_HOST = '127.0.0.1'
  NEXT_PUBLIC_SUPABASE_URL = 'https://ajbkuiyhpoiuezsittpy.supabase.co'
  NEXT_PUBLIC_R2_PUBLIC_DOMAIN = 'pub-83e39df2389c4bef95c442c0e0c6a8ad.r2.dev'

[mounts]
  source = 'radio_data'
  destination = '/music'

# HTTP and HTTPS Service (Nginx stream and status page proxy)
[[services]]
  internal_port = 80
  protocol = 'tcp'
  
  [[services.ports]]
    force_https = true
    handlers = ['http']
    port = 80

  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'

# TCP Live Harbor DJ Input Service (Direct raw TCP to Liquidsoap harbor)
[[services]]
  internal_port = 8005
  protocol = 'tcp'

  [[services.ports]]
    port = 8005

# Liquidsoap HTTP Command API (server.harbor)
[[services]]
  internal_port = 7000
  protocol = 'tcp'

  [[services.ports]]
    port = 7000

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
