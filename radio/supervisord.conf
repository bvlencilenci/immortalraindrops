[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
priority=30
command=/bin/bash -c "until curl -s http://127.0.0.1:8000/ >/dev/null; do sleep 1; done && exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:icecast]
priority=10
command=icecast2 -c /etc/icecast2/icecast.xml
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:liquidsoap]
priority=20
command=bash -c "echo 'Waiting for tracks...' && until [ $(find /music/unified -name '*.mp3' -o -name '*.wav' -o -name '*.flac' | wc -l) -gt 0 ]; do echo 'No tracks yet, waiting 10s...'; sleep 10; done && echo 'Tracks found, starting Liquidsoap...' && liquidsoap /etc/liquidsoap/radio.liq"
user=liquidsoap
environment=HOME="/home/liquidsoap"
autostart=true
autorestart=true
startretries=15
startsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sync-daemon]
priority=15
command=/radio/sync-daemon.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
